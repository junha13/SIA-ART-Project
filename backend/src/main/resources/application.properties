# Spring Boot 애플리케이션의 이름을 설정합니다.
spring.application.name=backend

# ==========================================
# 데이터베이스 (PostgreSQL) 설정
# ==========================================
# 연결할 PostgreSQL 데이터베이스의 전체 URL입니다. (호스트, 포트, 데이터베이스명 포함)
spring.datasource.url=jdbc:postgresql://localhost:5432/artFinder
# 데이터베이스 접속에 사용할 사용자 이름입니다.
spring.datasource.username=postgres
# PostgreSQL JDBC 드라이버의 클래스 경로를 지정합니다.
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# 프로파일(Profile) 설정
# ==========================================
# 활성화할 프로파일을 지정합니다. 'secret'으로 설정하면 기본 설정 외에
# 'application-secret.properties' 파일의 설정을 추가로 불러와 덮어씁니다.
spring.profiles.active=secret

# ==========================================
# MyBatis 설정
# ==========================================
# 사용자 정의 타입 핸들러(예: JtsPointTypeHandler)가 있는 패키지를 지정하여 MyBatis가 자동으로 스캔하도록 합니다.
mybatis.type-handlers-package=lx.team2.backend.common.config
# SQL 쿼리가 작성된 XML 매퍼 파일들의 위치를 지정합니다. 'classpath:mapper/'는 resources/mapper 폴더를 의미합니다.
mybatis.mapper-locations=classpath:mapper/*.xml
# 데이터베이스의 스네이크 케이스(예: class_name) 컬럼명을 자바의 카멜 케이스(예: className) 필드명으로 자동 매핑해주는 기능입니다.
mybatis.configuration.map-underscore-to-camel-case=true
# XML 매퍼에서 VO나 DTO 클래스를 사용할 때, 전체 경로 대신 짧은 별칭(예: ClassVO)으로 사용할 수 있도록 스캔할 패키지를 지정합니다.
mybatis.type-aliases-package=lx.team2.backend.feature.**

# ==========================================
# 웹 리소스 캐시 설정
# ==========================================
# 정적 리소스(HTML, CSS, JS)의 캐싱을 비활성화합니다.
# 개발 중에는 수정 사항을 바로 확인하기 위해 끄는 것이 유용합니다.
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false
spring.web.resources.chain.enabled=false

# ==========================================
# Spring Security 기본 설정
# ==========================================
# Spring Security가 제공하는 가장 기본적인 인메모리(in-memory) 사용자의 이름과 비밀번호를 설정합니다.
# 별도의 로그인 설정 없이 간단한 인증을 테스트할 때 사용됩니다.
spring.security.user.name=1
spring.security.user.password=1